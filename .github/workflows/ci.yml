name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  OTP: '29.1.2'
  # line coverage floor for `make cover`; raise it as coverage grows
  MIN_COVERAGE: '80'
  REBAR3: '3.25.0'
  # the NIF shim's warnings are errors in CI (c_src/build.sh); local builds
  # only warn
  ENGINE_WERROR: '1'

jobs:
  # ---- Static checks: fail fast ------------------------------------------
  format:
    name: erlfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - run: rebar3 fmt --check

  lint:
    name: Elvis lint
    runs-on: ubuntu-24.04
    env:
      SKIP_ENGINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps (instrument NIF)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: static-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config') }}
      - run: rebar3 lint

  xref:
    name: XRef
    runs-on: ubuntu-24.04
    env:
      SKIP_ENGINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps (instrument NIF)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: static-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config') }}
      - run: rebar3 xref

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    env:
      SKIP_ENGINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps (instrument NIF)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build/*_plt
            _build/*/rebar3_*_plt
            ~/.cache/rebar3
          key: plt-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config') }}
          restore-keys: plt-otp-${{ env.OTP }}-
      - run: rebar3 dialyzer

  # ---- Build + tests: gated on static checks -----------------------------
  build:
    name: Build (sofia NIF)
    needs: [format, lint, xref, dialyzer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps (sofia + instrument)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config libssl-dev cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config', 'apps/chappe_sip/c_src/build.sh') }}
      - run: rebar3 compile

  eunit:
    name: EUnit
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config libssl-dev cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config', 'apps/chappe_sip/c_src/build.sh') }}
      - run: rebar3 eunit

  ct:
    name: Common Test
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config libssl-dev cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config', 'apps/chappe_sip/c_src/build.sh') }}
      # eunit + ct under cover; the gate only ratchets up
      - run: make cover MIN_COVERAGE=${{ env.MIN_COVERAGE }}
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover
          path: _build/test/cover

  # The suites gated on a real rtpengine, against the interop/ container.
  interop:
    name: rtpengine interop
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config libssl-dev cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config', 'apps/chappe_sip/c_src/build.sh') }}
      - run: make interop
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-ct-logs
          path: apps/chappe_rtpengine/_build/test/logs

  # chappe_sip against SIPp, pjsua and a dnsmasq server (one flow per RFC
  # clause, RFC 3263 resolution included), then every
  # app's requirement matrix; the demo tier must have no failing hard row.
  conformance:
    name: Conformance lab + compliance gate
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config libssl-dev cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config', 'apps/chappe_sip/c_src/build.sh') }}
      - run: make ct
      - run: make interop-conformance
      - run: make compliance GATE=demo
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-ct-logs
          path: _build/test/logs

  # A real JsSIP UA over WebSocket and a Kamailio container over UDP.
  sip-interop:
    name: SIP interop (JsSIP, Kamailio)
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config libssl-dev cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config', 'apps/chappe_sip/c_src/build.sh') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # no lockfile is committed for the interop drivers
      - run: npm install --no-audit --no-fund
        working-directory: apps/chappe_sip/interop
      - run: docker pull ghcr.io/kamailio/kamailio-ci:5.8
      - run: INTEROP=1 rebar3 ct --suite apps/chappe_sip/test/chappe_sip_interop_SUITE

  # The B2BUA as an SBC: SIPp through a chappe node to two FreeSWITCH peers,
  # with rtpengine and Kamailio, all on one docker network.
  sbc-interop:
    name: SBC interop (FreeSWITCH, rtpengine, Kamailio)
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config libssl-dev cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config', 'apps/chappe_sip/c_src/build.sh') }}
      - run: docker pull drachtio/drachtio-freeswitch-mrf:latest
      - run: docker pull ghcr.io/kamailio/kamailio-ci:5.8
      # the lab stays up after the run, so its logs can be read below
      - run: make interop-sbc
        env:
          SBC_KEEP: '1'
      - name: Lab logs
        if: failure()
        run: apps/chappe_sip/interop/sbc/lab.sh logs sbc || true
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sbc-interop-ct-logs
          path: _build/test/logs

  # The conference mixer behind a real rtpengine.
  mix-interop:
    name: chappe_mix interop
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config libssl-dev cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config', 'apps/chappe_sip/c_src/build.sh') }}
      - run: make interop-mix

  # The ESL client against a real FreeSWITCH, and its audio forks into
  # chappe_audio.
  esl-interop:
    name: FreeSWITCH ESL interop
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config libssl-dev cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config', 'apps/chappe_sip/c_src/build.sh') }}
      - run: make interop-esl

  # chappe_mrf against rtpengine and two FreeSWITCH media servers.
  mrf-interop:
    name: chappe_mrf interop (FreeSWITCH, rtpengine)
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config libssl-dev cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config', 'apps/chappe_sip/c_src/build.sh') }}
      - run: docker pull drachtio/drachtio-freeswitch-mrf:latest
      - run: make interop-mrf
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mrf-interop-ct-logs
          path: _build/test/logs

  # Five chappe_cluster nodes under a seeded schedule of partitions, kills,
  # pauses, delays and clock skews; the lease checker fails the job on any
  # overlapping lease.
  # The seed is in the log: SEED=... make interop-cluster replays it.
  cluster-interop:
    name: chappe_cluster lab (partitions, lease checker)
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - run: docker pull erlang:29.1.2
      - run: DURATION=5m make interop-cluster
      - name: Lease logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-lab-logs
          path: _build/clb/logs

  # The C NIF under ASan + UBSan (Linux container), then a short fuzz run:
  # 30 s per libFuzzer target and the NIF boundary fuzz suite.
  asan:
    name: NIF under ASan + UBSan, fuzz
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: make asan
      - run: make fuzz FUZZ_TIME=30
        env:
          FUZZ_ITERS: '15000'
      - name: Sanitizer and fuzz reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nif-asan-fuzz
          path: apps/chappe_sip/_build/nif-check

  # The lifecycle stress and smoke suites with the NIF under ThreadSanitizer
  # (clang runtime, Linux container); any race report fails.
  tsan:
    name: NIF under TSan
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: make tsan
      - name: TSan reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nif-tsan
          path: apps/chappe_sip/_build/nif-check/tsan

  # clang-tidy and gcc -fanalyzer on the NIF shim; any finding fails.
  lint-c:
    name: C static analysis (clang-tidy, -fanalyzer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: make lint-c
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-c
          path: apps/chappe_sip/_build/nif-check/lint-c
