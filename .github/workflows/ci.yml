name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  OTP: '29'
  REBAR3: '3.25.0'

jobs:
  # ---- Static checks: fail fast ------------------------------------------
  format:
    name: erlfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - run: rebar3 fmt --check

  lint:
    name: Elvis lint
    runs-on: ubuntu-24.04
    env:
      SKIP_ENGINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps (instrument NIF)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: static-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config') }}
      - run: rebar3 lint

  xref:
    name: XRef
    runs-on: ubuntu-24.04
    env:
      SKIP_ENGINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps (instrument NIF)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: static-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config') }}
      - run: rebar3 xref

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    env:
      SKIP_ENGINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps (instrument NIF)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build/*_plt
            _build/*/rebar3_*_plt
            ~/.cache/rebar3
          key: plt-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config') }}
          restore-keys: plt-otp-${{ env.OTP }}-
      - run: rebar3 dialyzer

  # ---- Build + tests: gated on static checks -----------------------------
  build:
    name: Build (sofia NIF)
    needs: [format, lint, xref, dialyzer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps (sofia + instrument)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config libssl-dev cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config', 'apps/chappe_sip/c_src/build.sh') }}
      - run: rebar3 compile

  eunit:
    name: EUnit
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config libssl-dev cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config', 'apps/chappe_sip/c_src/build.sh') }}
      - run: rebar3 eunit

  ct:
    name: Common Test
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config libssl-dev cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config', 'apps/chappe_sip/c_src/build.sh') }}
      - run: rebar3 ct

  # The suites gated on a real rtpengine, against the interop/ container.
  interop:
    name: rtpengine interop
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP }}
          rebar3-version: ${{ env.REBAR3 }}
      - name: System deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config libssl-dev cmake build-essential
      - uses: actions/cache@v5
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-otp-${{ env.OTP }}-${{ hashFiles('**/rebar.config', 'apps/chappe_sip/c_src/build.sh') }}
      - run: make interop
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-ct-logs
          path: apps/chappe_rtpengine/_build/test/logs
