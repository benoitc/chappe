name: Release

# The chappe bundle: a push to main that passes CI and bumps at least one
# app's version is released as YYYY.MM.N (tag vYYYY.MM.N), N counting the
# bundles of that month from 0. The release notes list every app's version
# and the CHANGELOG section of each app whose version changed since the
# previous bundle (scripts/bundle_notes.sh). Apps are not tagged: each is
# published to Hex on its own, by hand. A push that bumps no app releases
# nothing. Never tag or release by hand (docs/contributing/releasing.md).
#
# A pull request touching the release, an app's .app.src or its CHANGELOG
# runs it dry: the notes are built and uploaded, nothing is tagged or
# released.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/bundle_notes.sh
      - rebar.config
      - apps/*/src/*.app.src
      - apps/*/CHANGELOG.md

permissions:
  contents: write

# bundles from main run one after the other; a pull request's dry run has its own
concurrency:
  group: release-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      bundle: ${{ steps.n.outputs.bundle }}
      sha: ${{ steps.n.outputs.sha }}
      publish: ${{ steps.n.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: n
        name: Bundle name
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          sha="$(git rev-parse HEAD)"
          match='v20[0-9][0-9].[0-9][0-9].*'
          prev="$(git describe --tags --match "$match" --abbrev=0 "$sha^" 2>/dev/null || echo -)"
          # a pull request of several commits: compare with where it
          # leaves main, as its squash merge will be
          if [ "$prev" = - ] && [ -n "$BASE" ]; then
            prev="$(git merge-base "$BASE" "$sha")"
          fi
          bundle=""
          why=""
          if [ -n "$(git tag --points-at "$sha" -l "$match")" ]; then
            why="already released: $(git tag --points-at "$sha" -l "$match")"
          elif [ -z "$(scripts/bundle_notes.sh --changed "$prev" "$sha")" ]; then
            why="no app version changed since $prev: nothing to release"
          else
            ym="$(TZ=UTC git log -1 --date=format-local:%Y.%m --format=%cd "$sha")"
            bundle="$ym.$(git tag -l "v$ym.*" | wc -l | tr -d ' ')"
          fi
          echo "${why:-bundle $bundle}"
          publish=false
          if [ -n "$bundle" ] && [ "${{ github.event_name }}" = workflow_run ]; then
            publish=true
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "why=$why" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Notes
        env:
          BUNDLE: ${{ steps.n.outputs.bundle }}
          PREV: ${{ steps.n.outputs.prev }}
          WHY: ${{ steps.n.outputs.why }}
        run: |
          if [ -n "$BUNDLE" ]; then
            echo "# chappe $BUNDLE" >> "$GITHUB_STEP_SUMMARY"
            scripts/bundle_notes.sh "$PREV" HEAD > notes.md
          else
            echo "$WHY" > notes.md
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  release:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUNDLE: ${{ needs.plan.outputs.bundle }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: out
      - name: Tag and release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$BUNDLE" -m "chappe $BUNDLE" "${{ needs.plan.outputs.sha }}"
          git push origin "v$BUNDLE"
          gh release create "v$BUNDLE" --title "chappe $BUNDLE" \
            --notes-file out/notes.md
