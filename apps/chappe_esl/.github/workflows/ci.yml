name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: the jobs only read the checkout.
permissions:
  contents: read

jobs:
  test:
    name: Tests OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        otp: ['29.1.2']
    steps:
      # actions pinned by commit SHA (mutable tags are a supply-chain risk)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.25.0'

      - name: Cache build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-${{ matrix.otp }}-

      - name: Compile
        run: rebar3 compile

      - name: EUnit
        run: rebar3 eunit

      - name: Common Test
        run: rebar3 ct

  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '29.1.2'
          rebar3-version: '3.25.0'

      - name: Cache build + PLT
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-static-otp29-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-static-otp29-

      - name: Compile
        run: rebar3 compile

      - name: Elvis lint
        run: rebar3 lint

      - name: XRef
        run: rebar3 xref

      - name: Dialyzer
        run: rebar3 dialyzer

      - name: Format check
        run: rebar3 fmt --check
