# FreeSWITCH for the chappe_sip_media e2e track (INTEROP=1).
#
# Brings up a vanilla FreeSWITCH with its Event Socket reachable from the host:
# the mounted event_socket.conf.xml binds 0.0.0.0 and drops the loopback ACL so
# the test can connect over the published port. The mounted dialplan replaces
# the default context with a single "chappe_wait" extension (answer + park) so the
# suite can create a deterministic, controllable channel with a loopback
# originate. Test-only, insecure: do not use this config in production.
services:
  freeswitch:
    image: ${FREESWITCH_IMAGE:-safarov/freeswitch:latest}
    container_name: chappe-fs-e2e
    ports:
      - "127.0.0.1:8021:8021"
    volumes:
      - ./conf/event_socket.conf.xml:/etc/freeswitch/autoload_configs/event_socket.conf.xml:ro
      - ./conf/acl.conf.xml:/etc/freeswitch/autoload_configs/acl.conf.xml:ro
      - ./conf/dialplan_default.xml:/etc/freeswitch/dialplan/default.xml:ro
