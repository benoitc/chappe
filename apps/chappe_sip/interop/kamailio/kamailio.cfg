#
# Minimal Kamailio config for chappe_sip interop.
#
# The dispatcher module pings a single destination (chappe, passed in the
# mounted dispatcher.list) with OPTIONS every second. chappe answers 200, so
# Kamailio marks the destination Active. That single flow proves both wire
# directions: Kamailio emits OPTIONS that chappe parses, and chappe emits a 200
# that Kamailio parses and accepts.
#
# request_route answers any OPTIONS this instance receives with 200, so the
# reverse probe (chappe -> Kamailio) also succeeds.

debug=1
log_stderror=yes
fork=yes
children=1
auto_aliases=no
server_header="Server: kamailio-interop"

listen=udp:0.0.0.0:5060

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "pv.so"
loadmodule "ctl.so"
loadmodule "dispatcher.so"

# kamcmd reads this socket via `kamcmd -s unix:/tmp/kamailio_ctl`.
modparam("ctl", "binrpc", "unix:/tmp/kamailio_ctl")

modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "ds_ping_interval", 1)
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_ping_from", "sip:kamailio@kamailio.invalid")
modparam("dispatcher", "ds_probing_mode", 1)

request_route {
    if ($rm == "OPTIONS") {
        sl_send_reply("200", "OK");
        exit;
    }
    sl_send_reply("404", "Not Here");
    exit;
}
