# The conformance lab's zone (RFC 3263 cases). The SIPp container of a
# dns_* case sits at 10.253.7.30; this server at 10.253.7.53.
no-resolv
no-hosts
log-queries
log-facility=-
local=/lab/

# svc.lab: NAPTR to the UDP SRV, whose target listens on 5080, not 5060
naptr-record=svc.lab,10,10,S,SIP+D2U,,_sip._udp.svc.lab
srv-host=_sip._udp.svc.lab,uas.svc.lab,5080,0,0
host-record=uas.svc.lab,10.253.7.30

# svcs.lab: NAPTR to the TLS SRV; its first target is this server, where
# nothing listens on 5061, the second the SIPp TLS listener
naptr-record=svcs.lab,10,10,S,SIPS+D2T,,_sips._tcp.svcs.lab
srv-host=_sips._tcp.svcs.lab,dead.svcs.lab,5061,10,0
srv-host=_sips._tcp.svcs.lab,tls.svcs.lab,5061,20,0
host-record=dead.svcs.lab,10.253.7.53
host-record=tls.svcs.lab,10.253.7.30
