<!doctype html>
<!-- Copyright 2026 Benoit Chesneau
     SPDX-License-Identifier: Apache-2.0

     A browser softphone for the chappe demo SBC (JsSIP over WebSocket).
     Open it on http://localhost so the browser lets it use the microphone. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chappe demo phone</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #d8d8d2; --accent: #2f5d8a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181a; --fg: #ececea; --muted: #9a9a95; --line: #333336; --accent: #7aa7d6; }
  }
  body { background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif;
         max-width: 34rem; margin: 2rem auto; padding: 0 16px; }
  h1 { font-size: 1.2rem; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 1rem; }
  label { display: block; margin: .4rem 0; color: var(--muted); }
  input { width: 100%; box-sizing: border-box; padding: .4rem; background: transparent;
          color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
  button { margin: .3rem .3rem 0 0; padding: .45rem .9rem; border-radius: 4px;
           border: 1px solid var(--accent); background: transparent; color: var(--accent); }
  button:disabled { opacity: .4; }
  #log { font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; color: var(--muted);
         border-top: 1px solid var(--line); padding-top: .5rem; }
</style>
</head>
<body>
<h1>chappe demo phone</h1>
<fieldset>
  <label>User <input id="user" value="alice"></label>
  <label>Password <input id="pass" type="password" value="alice-demo"></label>
  <label>Domain <input id="domain" value="chappe.demo"></label>
  <label>WebSocket <input id="ws"></label>
  <button id="register">Register</button>
</fieldset>
<fieldset>
  <label>Call <input id="target" value="bob"></label>
  <button id="call" disabled>Call</button>
  <button id="hangup" disabled>Hang up</button>
  <button id="hold" disabled>Hold</button>
  <button id="unhold" disabled>Unhold</button>
</fieldset>
<fieldset id="incoming" hidden>
  <p id="ringing"></p>
  <button id="answer">Answer</button>
  <button id="decline">Decline</button>
</fieldset>
<audio id="remote" autoplay controls></audio>
<div id="log"></div>
<script type="module">
  // The npm package ships no browser build; esm.sh bundles it as one module.
  import JsSIP from "https://esm.sh/jssip@3.10.1?bundle";
  const $ = (id) => document.getElementById(id);
  $("ws").value = "ws://" + location.hostname + ":5066/ws";
  const log = (m) => { $("log").textContent = new Date().toLocaleTimeString() + " " + m + "\n" + $("log").textContent; };
  let ua = null, session = null;

  // Browsers only start audio after a click on the page, which is why an
  // incoming call waits for Answer instead of being picked up at once.
  function play(stream) {
    $("remote").srcObject = stream;
    $("remote").play().then(() => log("hearing the other side"),
                            (e) => log("audio blocked by the browser: " + e.message));
  }
  function attach(s) {
    session = s;
    ["hangup", "hold", "unhold"].forEach((b) => $(b).disabled = false);
    s.on("peerconnection", (e) => e.peerconnection.addEventListener("track", (t) => play(t.streams[0])));
    s.on("confirmed", () => log("call up"));
    s.on("hold", (e) => log("on hold (" + e.originator + ")"));
    s.on("unhold", (e) => log("off hold (" + e.originator + ")"));
    s.on("ended", (e) => { log("call ended: " + e.cause); done(); });
    s.on("failed", (e) => { log("call failed: " + e.cause); done(); });
    if (s.connection) {
      s.connection.addEventListener("track", (t) => play(t.streams[0]));
    }
  }
  function done() {
    session = null;
    $("incoming").hidden = true;
    ["hangup", "hold", "unhold"].forEach((b) => $(b).disabled = true);
  }

  $("register").onclick = () => {
    // Stopping the previous phone unregisters it and closes its socket a
    // moment later; its events must not be reported as the new phone's.
    if (ua) ua.stop();
    const ws = $("ws").value, user = $("user").value;
    const me = new JsSIP.UA({
      sockets: [new JsSIP.WebSocketInterface(ws)],
      uri: "sip:" + user + "@" + $("domain").value,
      password: $("pass").value,
      register: true,
      // Keepalive: the REGISTER is refreshed before these 120 s run out,
      // the server pings the WebSocket every 30 s (the browser answers),
      // and a dropped socket is reopened after 2 to 30 s, then registered
      // again.
      register_expires: 120,
      connection_recovery_min_interval: 2,
      connection_recovery_max_interval: 30
    });
    ua = me;
    const on = (ev, f) => me.on(ev, (e) => { if (ua === me) f(e); });
    let registered = false;
    on("connected", () => log("connected to " + ws));
    on("disconnected", (e) => {
      registered = false;
      $("call").disabled = true;
      log((e && e.error ? "cannot reach " : "connection closed, reconnecting to ") + ws);
    });
    on("registered", () => {
      log(registered ? "registration refreshed" : "registered as " + user);
      registered = true;
      $("call").disabled = false;
    });
    on("unregistered", () => { registered = false; log("unregistered"); });
    on("registrationFailed", (e) => log("registration failed: " + e.cause));
    me.on("newRTCSession", (e) => {
      if (e.originator === "remote") {
        const id = e.session.remote_identity;
        const who = id.display_name || id.uri.user || id.uri.toString();
        log("incoming call from " + who);
        $("ringing").textContent = who + " is calling";
        $("incoming").hidden = false;
        attach(e.session);
      }
    });
    ua.start();
  };

  $("call").onclick = () => {
    const s = ua.call("sip:" + $("target").value + "@" + $("domain").value,
                      { mediaConstraints: { audio: true, video: false } });
    log("calling " + $("target").value);
    attach(s);
  };
  $("answer").onclick = () => {
    $("incoming").hidden = true;
    session && session.answer({ mediaConstraints: { audio: true, video: false } });
  };
  $("decline").onclick = () => session && session.terminate({ status_code: 486 });
  $("hangup").onclick = () => session && session.terminate();
  $("hold").onclick = () => session && session.hold();
  $("unhold").onclick = () => session && session.unhold();
</script>
</body>
</html>
